name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SB_REF_VERSION: v1.14.2-lx.11

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - name: Exit gate (privileged)
        run: |
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          sudo env "PATH=$PATH" "RUSTUP_HOME=$RUSTUP_HOME" "CARGO_HOME=$CARGO_HOME" XRUST_TEST_REQUIRE_SO_MARK=1 cargo test -p core-runtime --lib outbound::dial::tests::the_options_reach_the_socket -- --exact
          sudo env "PATH=$PATH" "RUSTUP_HOME=$RUSTUP_HOME" "CARGO_HOME=$CARGO_HOME" cargo test -p core-runtime --test exit_gate -- --nocapture
          sudo env "PATH=$PATH" "RUSTUP_HOME=$RUSTUP_HOME" "CARGO_HOME=$CARGO_HOME" cargo test -p core-runtime --test inbounds -- --nocapture

  differential:
    name: check vs sing-box-lx
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build xrust
        run: cargo build --workspace
      - name: Fetch reference sing-box-lx
        run: |
          curl -fsSL -o ref.tar.gz \
            "https://github.com{SB_REF_VERSION}/sing-box-${SB_REF_VERSION#v}-linux-amd64.tar.gz"
          mkdir -p "$HOME/ref" && tar -xzf ref.tar.gz -C "$HOME/ref"
          REF_BIN="$(find "$HOME/ref" -type f -name sing-box | head -1)"
          chmod +x "$REF_BIN"
          echo "SING_BOX_REF=$REF_BIN" >> "$GITHUB_ENV"
          "$REF_BIN" version
      - name: Run differential harness
        env:
          STRICT: "1"
        run: bash tests/differential/run.sh

  cross:
    name: Cross build (aarch64-musl)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - name: Build
        run: cargo build --locked --workspace --no-default-features --features rust-x --release --target aarch64-unknown-linux-musl
      - name: Size budget (12 MiB ARM64)
        run: |
          size=$(stat -c%s "target/aarch64-unknown-linux-musl/release/xrust")
          echo "size=$size bytes"
          test "$size" -le 12582912
      - uses: actions/upload-artifact@v4
        with:
          name: xrust-aarch64-unknown-linux-musl
          path: target/aarch64-unknown-linux-musl/release/xrust
