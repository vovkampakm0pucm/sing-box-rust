name: Build OpenWrt Platforms

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.*"
      - ".cargo/**"
      - ".github/workflows/build-all.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: aarch64-musl
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - name: Build
        run: cargo build --locked --workspace --no-default-features --features rust-x --release --target aarch64-unknown-linux-musl
      - name: Size budget (12 MiB ARM64)
        run: test "$(stat -c%s target/aarch64-unknown-linux-musl/release/xrust)" -le 12582912
      - name: Architecture check
        run: file target/aarch64-unknown-linux-musl/release/xrust
      - name: Pack
        run: |
          name="rust-x-aarch64-musl"
          cp "target/aarch64-unknown-linux-musl/release/xrust" "$name"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: aarch64-musl
          path: |
            rust-x-aarch64-musl.tar.gz
            rust-x-aarch64-musl.tar.gz.sha256
          if-no-files-found: error
