name: Release

on:
  push:
    tags: ["rust-x-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to build (must match Cargo.toml)"
        required: true
        default: "rust-x-v0.0.40"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SIZE_BUDGET: 12582912

jobs:
  check-version:
    name: tag matches the workspace version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Read the version the binaries will report
        id: version
        run: |
          in_cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="${{ inputs.tag || github.ref_name }}"
          echo "cargo=$in_cargo tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$in_cargo" != "${tag#rust-x-v}" ]; then
            echo "::error::Cargo.toml says $in_cargo, the release is tagged $tag"
            exit 1
          fi

  build:
    name: aarch64
    needs: check-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Apply VMess patch
        run: git apply --verbose vmess.patch

      - name: Toolchain (prebuilt std)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-musl

      - name: Build
        shell: bash
        run: |
          cargo build --locked --workspace --no-default-features --features rust-x --release --target aarch64-unknown-linux-musl

      - name: Size budget
        shell: bash
        run: |
          bin="target/aarch64-unknown-linux-musl/release/xrust"
          size=$(wc -c < "$bin" | tr -d ' ')
          echo "aarch64: $size bytes, budget $SIZE_BUDGET"
          test "$size" -le "$SIZE_BUDGET"

      - name: The binary is for this architecture
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          file "target/aarch64-unknown-linux-musl/release/xrust"

      - name: Pack (Unix)
        shell: bash
        run: |
          ver="${{ inputs.tag || github.ref_name }}"
          name="rust-x-aarch64-${ver#rust-x-}"
          bin="target/aarch64-unknown-linux-musl/release/xrust"
          cp "$bin" "./${name}"

          tar -czf "${name}.tar.gz" "./${name}"
          shasum -a 256 "${name}.tar.gz" > "${name}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: release-aarch64
          path: |
            rust-x-aarch64-*.tar.gz
            rust-x-aarch64-*.sha256
          if-no-files-found: warn

  release:
    name: attach to the release
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Install OpenWrt APK host tool
        run: bash scripts/openwrt_apk_tool.sh
      - name: OpenWrt APK/IPK packages
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          for archive in artifacts/*.tar.gz; do tar -xzf "$archive" -C artifacts; done
          sudo python3 scripts/package_openwrt.py --binaries artifacts --cpus "aarch64" --output artifacts --apk-tool "$APK_TOOL" --version "${tag#rust-x-v}" --source-commit "$(git rev-parse HEAD)"
          cat artifacts/OPENWRT-SHA256SUMS > artifacts/openwrt.sha256
          rm artifacts/OPENWRT-SHA256SUMS
      - name: One checksum file for everything
        run: |
          cd artifacts
          sha256sum ./*.apk ./*.ipk ./*.tar.gz > SHA256SUMS
          rm -f ./*.sha256
          cat SHA256SUMS
      - name: The notes for this version, not the whole file
        id: notes
        run: |
          ver="${{ inputs.tag || github.ref_name }}"
          ver="${ver#rust-x-v}"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if [ -f "docs/releases/$ver.md" ]; then
            cp "docs/releases/$ver.md" notes.md
            exit 0
          fi
          awk -v want="## $ver" '
            /^## / { inside = ($0 == want) }
            inside
          ' CHANGELOG.md > notes.md
          if ! grep -q '^## ' notes.md; then
            echo "## Release $ver" > notes.md
          fi
          cat notes.md
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Xrust ${{ steps.notes.outputs.version }}
          draft: true
          body_path: notes.md
          files: |
            artifacts/*.apk
            artifacts/*.ipk
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
            artifacts/openwrt-manifest.json
          fail_on_unmatched_files: false
